title: "[Question] "
labels: ["question"]
body:
  - type: textarea
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    attributes:
      label: What have you tried?
      description: Steps taken, errors seen, relevant config/env.
    validations:
      required: true
  - type: input
    attributes:
      label: Environment
      description: OS, Node version, browser, deployment (local/Vercel/etc).
    validations:
      required: false
